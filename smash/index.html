<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checklist Smash</title>
  <style>
    :root {
      --fond: #f4f1ea;
      --carte: #ffffff;
      --texte: #1f1d1a;
      --doux: #6b665e;
      --accent: #2f7d6d;
      --bord: #e2ddd2;
      --coche: #dcefe9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fond: #16181b;
        --carte: #202328;
        --texte: #ece9e2;
        --doux: #9a968e;
        --accent: #5cc2aa;
        --bord: #2e3238;
        --coche: #1d3530;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fond);
      color: var(--texte);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .retour {
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      margin-bottom: 16px;
    }
    .retour:hover { text-decoration: underline; }
    h1 { font-size: 1.8rem; margin: 0 0 4px; }
    .sous-titre { color: var(--doux); margin: 0 0 20px; }

    .barre {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      background: var(--carte);
      border: 1px solid var(--bord);
      border-radius: 12px;
    }
    .compteur { font-weight: 600; }
    .compteur span { color: var(--accent); font-variant-numeric: tabular-nums; }
    .jauge {
      flex: 1;
      min-width: 120px;
      height: 8px;
      background: var(--fond);
      border-radius: 4px;
      overflow: hidden;
    }
    .jauge div {
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width .2s;
    }
    .actions { display: flex; gap: 8px; }
    button {
      font: inherit;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--bord);
      background: var(--fond);
      color: var(--texte);
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }

    .liste {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
    }
    .perso label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--carte);
      border: 1px solid var(--bord);
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .perso label:hover { border-color: var(--accent); }
    .perso input { accent-color: var(--accent); width: 18px; height: 18px; flex-shrink: 0; }
    .perso input:checked + .num + .nom { text-decoration: line-through; text-decoration-color: var(--doux); }
    .perso label:has(input:checked) { background: var(--coche); border-color: var(--accent); }
    .num {
      color: var(--doux);
      font-size: .85rem;
      font-variant-numeric: tabular-nums;
      min-width: 3.2ch;
    }
    .nom { flex: 1; }
    .tag {
      font-size: .7rem;
      padding: 1px 6px;
      border-radius: 6px;
      border: 1px solid var(--bord);
      color: var(--doux);
      white-space: nowrap;
    }
    .tag.dlc { border-color: var(--accent); color: var(--accent); }
    .note { color: var(--doux); font-size: .85rem; margin-top: 20px; }
  </style>
</head>
<body>
  <main>
    <a class="retour" href="../index.html">← Accueil</a>
    <h1>Checklist Smash</h1>
    <p class="sous-titre">Tous les combattants de Super Smash Bros. Ultimate, à cocher.</p>

    <div class="barre">
      <div class="compteur"><span id="nb-coches">0</span> / <span id="nb-total">0</span> cochés</div>
      <div class="jauge" aria-hidden="true"><div id="jauge"></div></div>
      <div class="actions">
        <button id="tout-cocher">Tout cocher</button>
        <button id="tout-decocher">Tout décocher</button>
      </div>
    </div>

    <ul class="liste" id="liste"></ul>

    <p class="note">Tes cases sont gardées dans ce navigateur seulement : elles ne suivent pas sur un autre navigateur ou un autre appareil.</p>
  </main>

  <script>
    // ===== Liste des combattants (modifiable) =====
    // num : numéro officiel · nom : nom français · type : "epigone" ou "dlc" (sinon rien)
    const PERSOS = [
      { num: "01", nom: "Mario" },
      { num: "02", nom: "Donkey Kong" },
      { num: "03", nom: "Link" },
      { num: "04", nom: "Samus" },
      { num: "04ε", nom: "Samus sombre", type: "epigone" },
      { num: "05", nom: "Yoshi" },
      { num: "06", nom: "Kirby" },
      { num: "07", nom: "Fox" },
      { num: "08", nom: "Pikachu" },
      { num: "09", nom: "Luigi" },
      { num: "10", nom: "Ness" },
      { num: "11", nom: "Captain Falcon" },
      { num: "12", nom: "Rondoudou" },
      { num: "13", nom: "Peach" },
      { num: "13ε", nom: "Daisy", type: "epigone" },
      { num: "14", nom: "Bowser" },
      { num: "15", nom: "Ice Climbers" },
      { num: "16", nom: "Sheik" },
      { num: "17", nom: "Zelda" },
      { num: "18", nom: "Dr. Mario" },
      { num: "19", nom: "Pichu" },
      { num: "20", nom: "Falco" },
      { num: "21", nom: "Marth" },
      { num: "21ε", nom: "Lucina", type: "epigone" },
      { num: "22", nom: "Link enfant" },
      { num: "23", nom: "Ganondorf" },
      { num: "24", nom: "Mewtwo" },
      { num: "25", nom: "Roy" },
      { num: "25ε", nom: "Chrom", type: "epigone" },
      { num: "26", nom: "Mr. Game & Watch" },
      { num: "27", nom: "Meta Knight" },
      { num: "28", nom: "Pit" },
      { num: "28ε", nom: "Pit maléfique", type: "epigone" },
      { num: "29", nom: "Samus sans armure" },
      { num: "30", nom: "Wario" },
      { num: "31", nom: "Snake" },
      { num: "32", nom: "Ike" },
      { num: "33-35", nom: "Dresseur de Pokémon" },
      { num: "36", nom: "Diddy Kong" },
      { num: "37", nom: "Lucas" },
      { num: "38", nom: "Sonic" },
      { num: "39", nom: "Roi DaDiDou" },
      { num: "40", nom: "Olimar" },
      { num: "41", nom: "Lucario" },
      { num: "42", nom: "R.O.B." },
      { num: "43", nom: "Link cartoon" },
      { num: "44", nom: "Wolf" },
      { num: "45", nom: "Villageois" },
      { num: "46", nom: "Mega Man" },
      { num: "47", nom: "Entraîneuse Wii Fit" },
      { num: "48", nom: "Harmonie & Luma" },
      { num: "49", nom: "Little Mac" },
      { num: "50", nom: "Amphinobi" },
      { num: "51", nom: "Boxeur Mii" },
      { num: "52", nom: "Épéiste Mii" },
      { num: "53", nom: "Tireur Mii" },
      { num: "54", nom: "Palutena" },
      { num: "55", nom: "Pac-Man" },
      { num: "56", nom: "Daraen" },
      { num: "57", nom: "Shulk" },
      { num: "58", nom: "Bowser Jr." },
      { num: "59", nom: "Duo Duck Hunt" },
      { num: "60", nom: "Ryu" },
      { num: "60ε", nom: "Ken", type: "epigone" },
      { num: "61", nom: "Cloud" },
      { num: "62", nom: "Corrin" },
      { num: "63", nom: "Bayonetta" },
      { num: "64", nom: "Inkling" },
      { num: "65", nom: "Ridley" },
      { num: "66", nom: "Simon" },
      { num: "66ε", nom: "Richter", type: "epigone" },
      { num: "67", nom: "King K. Rool" },
      { num: "68", nom: "Marie" },
      { num: "69", nom: "Félinferno" },
      { num: "70", nom: "Plante Piranha", type: "dlc" },
      { num: "71", nom: "Joker", type: "dlc" },
      { num: "72", nom: "Héros", type: "dlc" },
      { num: "73", nom: "Banjo & Kazooie", type: "dlc" },
      { num: "74", nom: "Terry", type: "dlc" },
      { num: "75", nom: "Byleth", type: "dlc" },
      { num: "76", nom: "Min Min", type: "dlc" },
      { num: "77", nom: "Steve", type: "dlc" },
      { num: "78", nom: "Sephiroth", type: "dlc" },
      { num: "79", nom: "Pyra", type: "dlc" },
      { num: "80", nom: "Mythra", type: "dlc" },
      { num: "81", nom: "Kazuya", type: "dlc" },
      { num: "82", nom: "Sora", type: "dlc" },
    ];

    const CLE_SAUVEGARDE = "neanuphar-smash-coches";
    const ETIQUETTES = { epigone: "épigone", dlc: "DLC" };

    // ===== Sauvegarde locale (marche aussi si le navigateur la bloque) =====
    function lireCoches() {
      try {
        return new Set(JSON.parse(localStorage.getItem(CLE_SAUVEGARDE)) || []);
      } catch (e) {
        return new Set();
      }
    }
    function ecrireCoches() {
      try {
        localStorage.setItem(CLE_SAUVEGARDE, JSON.stringify([...coches]));
      } catch (e) { /* pas de sauvegarde possible, la page marche quand même */ }
    }

    const coches = lireCoches();
    const liste = document.getElementById("liste");

    // ===== Affichage =====
    function construire() {
      liste.innerHTML = "";
      PERSOS.forEach((p) => {
        const li = document.createElement("li");
        li.className = "perso";
        const label = document.createElement("label");

        const caseACocher = document.createElement("input");
        caseACocher.type = "checkbox";
        caseACocher.checked = coches.has(p.num);
        caseACocher.addEventListener("change", () => {
          if (caseACocher.checked) coches.add(p.num);
          else coches.delete(p.num);
          ecrireCoches();
          majCompteur();
        });

        const num = document.createElement("span");
        num.className = "num";
        num.textContent = p.num;

        const nom = document.createElement("span");
        nom.className = "nom";
        nom.textContent = p.nom;

        label.append(caseACocher, num, nom);
        if (p.type) {
          const tag = document.createElement("span");
          tag.className = "tag " + p.type;
          tag.textContent = ETIQUETTES[p.type];
          label.append(tag);
        }
        li.append(label);
        liste.append(li);
      });
      majCompteur();
    }

    function majCompteur() {
      const total = PERSOS.length;
      const n = PERSOS.filter((p) => coches.has(p.num)).length;
      document.getElementById("nb-coches").textContent = n;
      document.getElementById("nb-total").textContent = total;
      document.getElementById("jauge").style.width = (total ? (n / total) * 100 : 0) + "%";
    }

    function toutMettre(etat) {
      coches.clear();
      if (etat) PERSOS.forEach((p) => coches.add(p.num));
      ecrireCoches();
      construire();
    }

    document.getElementById("tout-cocher").addEventListener("click", () => toutMettre(true));
    document.getElementById("tout-decocher").addEventListener("click", () => {
      if (coches.size === 0 || confirm("Tout décocher ?")) toutMettre(false);
    });

    construire();
  </script>
</body>
</html>
